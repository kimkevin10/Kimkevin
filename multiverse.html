<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MULTIVERSE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; width: 100vw; height: 100vh; font-family: 'Courier New', monospace; }
  #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  #camCanvas {
    position: absolute; bottom: 16px; right: 16px;
    width: 180px; height: 135px;
    border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
    z-index: 10; transform: scaleX(-1);
  }
  #lmCanvas {
    position: absolute; bottom: 16px; right: 16px;
    width: 180px; height: 135px;
    border-radius: 10px; z-index: 11; pointer-events: none;
  }
  #state-display {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.6); font-size: 12px; letter-spacing: 0.25em;
    text-transform: uppercase; z-index: 20;
  }
  #debug {
    position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
    color: rgba(100,255,200,0.7); font-size: 10px; letter-spacing: 0.1em;
    z-index: 20; text-align: center; line-height: 1.8;
  }
  #guide {
    position: absolute; bottom: 20px; left: 20px;
    color: rgba(255,255,255,0.3); font-size: 10px; line-height: 2; letter-spacing: 0.08em; z-index: 20;
  }
  #guide span { color: rgba(255,255,255,0.6); }
</style>
</head>
<body>
<canvas id="threeCanvas"></canvas>
<video id="video" style="display:none" playsinline autoplay></video>
<canvas id="camCanvas" width="180" height="135"></canvas>
<canvas id="lmCanvas" width="180" height="135"></canvas>

<div id="state-display">카메라 로딩 중...</div>
<div id="debug"></div>
<div id="guide">
  <span>왼손 펼침</span> — 은하 소환<br>
  <span>오른손 핀치 거리</span> — 확대 / 축소<br>
  <span>오른손 핀치 닫힘</span> — 수렴 → 폭발<br>
  <span>왼손 주먹</span> — 고정 (고정 중 오른손 회전 = 은하 회전)
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
// ── CONFIG
const PARTICLE_COUNT = 5000;
const SMOOTH_FRAMES = 14;
const ROT_SMOOTH = 10;
const ROT_SNAP_DEG = 5;
// 핀치 거리 단계 임계값 (정규화 0~1)
// 단계: 0=완전닫힘(폭발), 1=축소, 2=기본, 3=확대, 4=최대확대
const THRESH = [0.08, 0.22, 0.38, 0.54];
const HYST   = 0.04;
const STAGE_SCALES = [1.0, 0.45, 1.0, 1.7, 2.6];

// ── STATE
let appState = 'idle';
let galaxyVisible = false;
let summonProgress = 0;
let convergeProgress = 0;
let explodeTime = 0;
let explodeActive = false;
let explodeVels = null;
let galaxyScale = 1.0;
let galaxyTargetScale = 1.0;
let galaxyRotY = 0;
let galaxyRotTarget = 0;
let pinchStage = 2;
let pinchBuf = [];
let rotBuf = [];
let angleFixStart = null;
let rotFixStart = 0;
let autoRotating = false;

// ── THREE.JS
const canvas3d = document.getElementById('threeCanvas');
const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
const cam3d = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
cam3d.position.set(0, 2, 20);
cam3d.lookAt(0, 0, 0);

// 배경 별
const bgGeo = new THREE.BufferGeometry();
const bgPos = new Float32Array(4000 * 3);
for (let i = 0; i < 4000; i++) {
  bgPos[i*3]   = (Math.random()-0.5)*300;
  bgPos[i*3+1] = (Math.random()-0.5)*300;
  bgPos[i*3+2] = (Math.random()-0.5)*300;
}
bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
scene.add(new THREE.Points(bgGeo, new THREE.PointsMaterial({ color:0xffffff, size:0.07, transparent:true, opacity:0.35 })));

// 파티클
const pPositions = new Float32Array(PARTICLE_COUNT * 3);
const pColors    = new Float32Array(PARTICLE_COUNT * 3);
const pBase      = new Float32Array(PARTICLE_COUNT * 3); // 은하 원형

function buildGalaxy() {
  const ARMS = 3;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const arm    = i % ARMS;
    const armAng = (arm / ARMS) * Math.PI * 2;
    const r      = Math.pow(Math.random(), 0.45) * 8.5;
    const spin   = r * 0.55;
    const spread = 0.15 + (1 - r/8.5) * 0.4;
    const ang    = armAng + spin + (Math.random()-0.5) * spread * 2.5;

    pBase[i*3]   = Math.cos(ang) * r + (Math.random()-0.5)*0.3;
    pBase[i*3+1] = (Math.random()-0.5) * (0.25 + (1-r/8.5)*0.6);
    pBase[i*3+2] = Math.sin(ang) * r + (Math.random()-0.5)*0.3;

    const core = 1 - r/8.5;
    pColors[i*3]   = 0.55 + core*0.45;
    pColors[i*3+1] = 0.35 + core*0.45;
    pColors[i*3+2] = 0.85 + core*0.15;
  }
}
buildGalaxy();

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions.slice(), 3));
pGeo.setAttribute('color',    new THREE.BufferAttribute(pColors, 3));

const pMat = new THREE.ShaderMaterial({
  uniforms: { uOpacity:{ value:0 }, uConverge:{ value:0 } },
  vertexShader:`
    attribute vec3 color; varying vec3 vColor; varying float vR;
    uniform float uConverge;
    void main(){
      vColor=color; vR=length(position);
      vec4 mv=modelViewMatrix*vec4(position,1.0);
      float sz=2.8+(1.0-min(vR/8.5,1.0))*2.2;
      gl_PointSize=sz*(280.0/-mv.z);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    varying vec3 vColor; varying float vR;
    uniform float uOpacity;
    void main(){
      vec2 uv=gl_PointCoord-0.5; float d=length(uv);
      if(d>0.5)discard;
      float a=(1.0-d*2.0)*uOpacity;
      gl_FragColor=vec4(vColor,a);
    }`,
  transparent:true, depthWrite:false,
  blending: THREE.AdditiveBlending, vertexColors:true,
});

const particleMesh = new THREE.Points(pGeo, pMat);
scene.add(particleMesh);

// ── HELPERS
function eio(t){ return t<0.5?2*t*t:-1+(4-2*t)*t; }

function movAvg(buf, val, n){
  buf.push(val); if(buf.length>n) buf.shift();
  return buf.reduce((a,b)=>a+b,0)/buf.length;
}

function calcStage(dist, prev){
  let s = prev;
  for(let i=0;i<THRESH.length;i++){
    if(prev<=i && dist>THRESH[i]+HYST){ s=i+1; break; }
    if(prev>i  && dist<THRESH[i]-HYST){ s=i;   break; }
  }
  return Math.max(0, Math.min(4, s));
}

function d2(a,b){ return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2); }

function isOpen(lm){
  let n=0;
  [[8,6],[12,10],[16,14],[20,18]].forEach(([t,m])=>{ if(lm[t].y<lm[m].y) n++; });
  return n>=3;
}
function isFist(lm){
  let n=0;
  [[8,6],[12,10],[16,14],[20,18]].forEach(([t,m])=>{ if(lm[t].y>lm[m].y) n++; });
  return n>=3;
}
function pinchAng(lm){
  return Math.atan2(lm[8].y-lm[4].y, lm[8].x-lm[4].x)*180/Math.PI;
}

function updateParticles(scale, converge, expT){
  const pos = pGeo.attributes.position.array;
  const cy = Math.cos(galaxyRotY), sy = Math.sin(galaxyRotY);
  for(let i=0;i<PARTICLE_COUNT;i++){
    let bx=pBase[i*3], by=pBase[i*3+1], bz=pBase[i*3+2];
    // 회전
    const rx = bx*cy - bz*sy;
    const rz = bx*sy + bz*cy;
    // 스케일 + 수렴
    const c = eio(Math.min(converge,1));
    pos[i*3]   = rx * scale * (1-c);
    pos[i*3+1] = by * scale * (1-c);
    pos[i*3+2] = rz * scale * (1-c);
    // 폭발
    if(explodeActive && explodeVels){
      const ease = Math.pow(Math.min(expT,1), 0.3);
      pos[i*3]   += explodeVels[i*3]   * ease * 14;
      pos[i*3+1] += explodeVels[i*3+1] * ease * 14;
      pos[i*3+2] += explodeVels[i*3+2] * ease * 14;
    }
  }
  pGeo.attributes.position.needsUpdate = true;
}

function initExplode(){
  explodeVels = new Float32Array(PARTICLE_COUNT*3);
  for(let i=0;i<PARTICLE_COUNT;i++){
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    const sp=0.4+Math.random()*1.8;
    explodeVels[i*3]   = Math.sin(ph)*Math.cos(th)*sp;
    explodeVels[i*3+1] = Math.cos(ph)*sp*0.5;
    explodeVels[i*3+2] = Math.sin(ph)*Math.sin(th)*sp;
  }
}

function setState(s){
  appState=s;
  document.getElementById('state-display').textContent=s.toUpperCase();
}

function resetAll(){
  galaxyVisible=false; explodeActive=false;
  galaxyScale=1; galaxyTargetScale=1;
  galaxyRotY=0; galaxyRotTarget=0;
  pinchStage=2; pinchBuf=[]; rotBuf=[];
  convergeProgress=0; summonProgress=0; explodeTime=0;
  pMat.uniforms.uOpacity.value=0;
  pMat.uniforms.uConverge.value=0;
  angleFixStart=null;
  setState('idle');
}

// ── MEDIAPIPE
const video   = document.getElementById('video');
const camCvs  = document.getElementById('camCanvas');
const lmCvs   = document.getElementById('lmCanvas');
const camCtx  = camCvs.getContext('2d');
const lmCtx   = lmCvs.getContext('2d');
const dbg     = document.getElementById('debug');

let leftHand=null, rightHand=null;

const mpHands = new Hands({
  locateFile: f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});
mpHands.setOptions({
  maxNumHands:2, modelComplexity:1,
  minDetectionConfidence:0.72, minTrackingConfidence:0.72
});

mpHands.onResults(results=>{
  // 카메라 미리보기
  camCtx.save(); camCtx.scale(-1,1);
  camCtx.drawImage(results.image,-180,0,180,135);
  camCtx.restore();
  lmCtx.clearRect(0,0,180,135);

  leftHand=null; rightHand=null;

  if(results.multiHandLandmarks && results.multiHandedness){
    for(let i=0;i<results.multiHandLandmarks.length;i++){
      const label = results.multiHandedness[i].label;
      const lm    = results.multiHandLandmarks[i];
      // MediaPipe는 셀피 기준: 'Right'=화면 오른쪽=실제 왼손
      if(label==='Right') leftHand  = lm;
      if(label==='Left')  rightHand = lm;

      lmCtx.save(); lmCtx.scale(-1,1); lmCtx.translate(-180,0);
      drawConnectors(lmCtx,lm,HAND_CONNECTIONS,{color:'rgba(80,200,255,0.5)',lineWidth:1});
      drawLandmarks(lmCtx,lm,{color:'rgba(255,255,255,0.9)',lineWidth:0.5,radius:2});
      lmCtx.restore();
    }
  }

  // 디버그 표시
  const lStr = leftHand  ? (isOpen(leftHand)?'왼손:펼침':isFist(leftHand)?'왼손:주먹':'왼손:중간') : '왼손:없음';
  const rDist = rightHand ? d2(rightHand[4],rightHand[8]).toFixed(3) : '-';
  const rStr = rightHand ? `오른손:핀치거리=${rDist}` : '오른손:없음';
  dbg.textContent = `${lStr}  |  ${rStr}`;

  processGestures();
});

function processGestures(){
  const leftOpen = leftHand  && isOpen(leftHand);
  const leftFist = leftHand  && isFist(leftHand);
  const rDist    = rightHand ? d2(rightHand[4],rightHand[8]) : null;
  const rAng     = rightHand ? pinchAng(rightHand) : null;

  switch(appState){

    case 'idle':
      if(leftOpen){ setState('summoning'); summonProgress=0; }
      break;

    case 'summoning':
      // summonProgress는 animate loop에서 증가
      break;

    case 'active':
      // 왼손 주먹 → 고정
      if(leftFist){
        setState('fixed');
        angleFixStart=null; rotFixStart=galaxyRotY;
        pinchBuf=[]; rotBuf=[];
        break;
      }
      // 오른손 핀치
      if(rDist!==null){
        const sm   = movAvg(pinchBuf, rDist, SMOOTH_FRAMES);
        const newS = calcStage(sm, pinchStage);
        if(newS!==pinchStage){
          pinchStage=newS;
          if(pinchStage===0){
            setState('converging'); convergeProgress=0;
          } else {
            galaxyTargetScale=STAGE_SCALES[pinchStage];
          }
        }
      }
      break;

    case 'fixed':
      // 왼손 펼침/없음 → active
      if(!leftFist){
        setState('active');
        angleFixStart=null; rotBuf=[];
        break;
      }
      // 오른손 회전
      if(rAng!==null){
        const sm  = movAvg(rotBuf, rAng, ROT_SMOOTH);
        const snp = Math.round(sm/ROT_SNAP_DEG)*ROT_SNAP_DEG;
        if(angleFixStart===null){ angleFixStart=snp; }
        else {
          let delta = snp - angleFixStart;
          galaxyRotTarget = rotFixStart + delta * Math.PI/180 * 0.9;
        }
      }
      break;

    case 'converging':
      // animate loop에서 처리
      break;

    case 'exploding':
      // animate loop에서 처리
      break;
  }
}

// ── ANIMATE
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  switch(appState){

    case 'summoning':
      summonProgress = Math.min(summonProgress + dt*0.38, 1);
      pMat.uniforms.uOpacity.value = eio(summonProgress)*0.92;
      if(summonProgress>=1){
        galaxyVisible=true;
        // 자동 회전 시작
        setState('active');
      }
      break;

    case 'active':
      // 스케일 보간
      galaxyScale += (galaxyTargetScale - galaxyScale)*0.055;
      // 자동 회전
      galaxyRotY += 0.0006;
      galaxyRotTarget = galaxyRotY;
      break;

    case 'fixed':
      // 스케일 고정 (변경 없음)
      // 회전 보간
      galaxyRotY += (galaxyRotTarget - galaxyRotY)*0.07;
      break;

    case 'converging':
      convergeProgress = Math.min(convergeProgress + dt*0.55, 1);
      pMat.uniforms.uConverge.value = eio(convergeProgress);
      if(convergeProgress>=1){
        setState('exploding');
        explodeActive=true; explodeTime=0;
        initExplode();
      }
      break;

    case 'exploding':
      explodeTime = Math.min(explodeTime + dt*0.45, 1);
      pMat.uniforms.uConverge.value = Math.max(0, 1 - eio(explodeTime)*1.5);
      if(explodeTime>0.55){
        const fade = 1-(explodeTime-0.55)/0.45;
        pMat.uniforms.uOpacity.value = Math.max(0, fade*0.92);
      }
      if(explodeTime>=1){ resetAll(); }
      break;
  }

  // 파티클 위치 업데이트
  if(galaxyVisible || appState==='summoning' || appState==='converging' || appState==='exploding'){
    updateParticles(galaxyScale, pMat.uniforms.uConverge.value, explodeTime);
  }

  renderer.render(scene, cam3d);
}

// ── CAMERA
const mpCam = new Camera(video,{
  onFrame: async()=>{ await mpHands.send({image:video}); },
  width:640, height:480
});
mpCam.start()
  .then(()=>{ setState('idle'); })
  .catch(()=>{ document.getElementById('state-display').textContent='카메라 권한을 허용해주세요'; });

window.addEventListener('resize',()=>{
  cam3d.aspect=window.innerWidth/window.innerHeight;
  cam3d.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

animate();
</script>
</body>
</html>
